<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rifas</title>
<style>
:root{--c:#0f766e;--bg:#f5f5f4;--card:#fff;--tx:#1c1917;--mu:#78716c;--ln:#e7e5e4;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.4}
main{max-width:760px;margin:0 auto;padding:16px 14px 110px}
a{color:var(--c)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
h1{font-size:1.5rem;margin:0 0 6px}h2{font-size:1.15rem;margin:0 0 10px}h3{font-size:1rem;margin:16px 0 8px}
.mu{color:var(--mu);font-size:.9rem}
.hero{position:relative;display:flex;color:#fff;border:none;padding:0;border-radius:16px;overflow:hidden;min-height:112px;
  background:radial-gradient(circle at 12% 0%,rgba(255,255,255,.22),transparent 45%),linear-gradient(140deg,color-mix(in srgb,var(--c) 80%,#fff),var(--c) 50%,color-mix(in srgb,var(--c) 70%,#000));
  box-shadow:0 8px 22px color-mix(in srgb,var(--c) 35%,transparent)}
.hero .izq{flex:1;min-width:0;padding:12px 12px 12px 14px;text-align:center}
.hero h1{font-size:.78rem;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:1px;margin:0;line-height:1.25}
.hero .premio{font-size:1.5rem;font-weight:900;line-height:1.08;margin:4px 0 8px;color:#fde047;text-shadow:0 2px 8px rgba(0,0,0,.28);overflow-wrap:anywhere}
.hero .premio.lg{font-size:1.22rem}
.hero .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.hero .chips span{font-size:.72rem;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2)}
.hero .der{width:100px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 4px;position:relative;border-left:2px dashed rgba(255,255,255,.45);background:rgba(0,0,0,.18)}
.hero .der::before,.hero .der::after{content:"";position:absolute;left:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.hero .der::before{top:-9px}.hero .der::after{bottom:-9px}
.hero .der small{font-size:.6rem;letter-spacing:2px;font-weight:800;opacity:.8}
.hero .der b{font-size:1.25rem;line-height:1.1;white-space:nowrap}
.hero .der b.lg{font-size:1rem}
.hero .der span{font-size:.65rem;opacity:.85}
.hero .mu{color:rgba(255,255,255,.85);font-size:.7rem;margin-top:6px}
.aviso{text-align:center;font-weight:600;padding:10px 14px}
.precio{font-size:1.3rem;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.n{aspect-ratio:1;border:1px solid var(--ln);border-radius:8px;background:#fff;font-weight:600;font-size:.95rem;cursor:pointer;padding:0;color:var(--tx);font-variant-numeric:tabular-nums}
.grid.c3 .n{font-size:.78rem}.grid.c4 .n{font-size:.66rem}
.n:disabled{opacity:1;cursor:default}
.n.oc{background:#b8b2ac;border-color:#b8b2ac;color:#6b645e;text-decoration:line-through}
.n.sel{background:var(--c);color:#fff;border-color:var(--c)}
.n.win{outline:3px solid #eab308;outline-offset:1px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ln);padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:10;box-shadow:0 -4px 14px rgba(0,0,0,.06)}
button,.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;font-size:.95rem;cursor:pointer;background:var(--c);color:#fff;text-decoration:none;display:inline-block;text-align:center;font-family:inherit}
.btn2{background:#fff;color:var(--tx);border:1px solid var(--ln)}
.btnbad{background:var(--bad);color:#fff}
.sm{padding:7px 11px;font-size:.85rem}
button:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-size:.85rem;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:9px;font:inherit;background:#fff;color:var(--tx)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.chk{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin-top:12px}
.chk input{width:auto;margin-top:3px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:.75rem;font-weight:700}
.p-ok{background:#dcfce7;color:var(--ok)}.p-bad{background:#fee2e2;color:var(--bad)}.venc{background:#fff7ed;border-radius:10px;padding:10px;border:1px solid #fed7aa;margin-bottom:6px}.p-warn{background:#fef3c7;color:var(--warn)}.p-mu{background:#e7e5e4;color:#57534e}
.item{border-top:1px solid var(--ln);padding:10px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .card{width:100%;max-width:520px;margin:0;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#1c1917;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;font-size:.9rem;max-width:90%;text-align:center}
.pago{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px dashed #d6d3d1;border-radius:10px;padding:10px;margin:6px 0}
.paso{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:.9rem;margin-right:8px;vertical-align:2px}
.big{font-size:1.6rem;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums}
.hide{display:none!important}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px}
.stat b{display:block;font-size:1.05rem}
</style>
</head>
<body>
<main id="app"><p class="mu">Cargando…</p></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, collection, query, where, onSnapshot, runTransaction, serverTimestamp, writeBatch, deleteField, FieldPath } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ================= 1. PEGA AQUÍ LA CONFIGURACIÓN DE TU PROYECTO FIREBASE =================
const firebaseConfig = {
  apiKey: "AIzaSyBInONlJ4I7jXoiit7zXGHbWg79al10TIA",
  authDomain: "rifas-706e7.firebaseapp.com",
  projectId: "rifas-706e7",
  storageBucket: "rifas-706e7.firebasestorage.app",
  messagingSenderId: "133243237585",
  appId: "1:133243237585:web:087ac4919361fea72e01f0"
};
// =========================================================================================

const COLOR = '#0f766e';
const TIPOS_PAGO = ['Llave Bre-B', 'Nequi', 'Daviplata', 'Bancolombia', 'Cuenta de ahorros', 'Otro'];

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);

const $ = id => document.getElementById(id);
const main = $('app');
const P = new URLSearchParams(location.search);
const BASE = location.origin + location.pathname;
let subs = [];
const limpiar = () => { subs.forEach(f => f()); subs = []; document.querySelectorAll('.bar,.modal').forEach(e => e.remove()); };

// ---------- utilidades ----------
const money = v => new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(v || 0);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n, c) => String(n).padStart(c, '0');
const aFecha = ts => ts?.toDate ? ts.toDate() : (ts ? new Date(ts) : null);
const fecha = ts => { const d = aFecha(ts); return d && !isNaN(d) ? d.toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' }) : ''; };
const hace = ts => {
  const d = aFecha(ts); if (!d) return '';
  const m = Math.floor((Date.now() - d) / 60000);
  if (m < 1) return 'hace un momento'; if (m < 60) return `hace ${m} min`;
  const h = Math.floor(m / 60); if (h < 24) return `hace ${h} h`;
  return `hace ${Math.floor(h / 24)} d`;
};
const waNum = n => { let d = String(n || '').replace(/\D/g, ''); if (d.length === 10) d = '57' + d; return d; };
const wa = (num, txt) => `https://wa.me/${waNum(num)}?text=${encodeURIComponent(txt)}`;
const color = r => document.documentElement.style.setProperty('--c', /^#[0-9a-f]{6}$/i.test(r?.color || '') ? r.color : COLOR);
const ESTADOS = { borrador: ['Borrador', 'p-mu'], abierta: ['Abierta', 'p-ok'], cerrada: ['Ventas cerradas', 'p-warn'], sorteada: ['Sorteada', 'p-mu'] };
const pillEstado = e => { const [t, c] = ESTADOS[e] || [e, 'p-mu']; return `<span class="pill ${c}" style="flex:0 0 auto">${esc(t)}</span>`; };

function toast(m, ms = 2800) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
async function copiar(t) { try { await navigator.clipboard.writeText(t); toast('Copiado ✓'); } catch { prompt('Copia este texto:', t); } }
document.addEventListener('click', e => { const b = e.target.closest('[data-copy]'); if (b) copiar(b.dataset.copy); });

// ---------- piezas compartidas ----------
const iniciales = n => String(n || '').trim().split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase() + '.').join(' ');
const linkBoleta = (rid, bid) => `${BASE}?r=${encodeURIComponent(rid)}&b=${encodeURIComponent(bid)}`;
const msgReserva = (r, x, link) =>
  `✅ *Pago de rifa – ${r.titulo}*\n` +
  `👤 ${x.nombre}\n📱 ${x.celular}\n` +
  `🔢 Números: *${x.numeros.join(', ')}*\n` +
  `💵 Total: *${money(x.total)}*\n\n` +
  `Ya hice la transferencia. Te adjunto el comprobante 👇\n` +
  `Mi boleta: ${link}`;
function hero(r) {
  const d = r.fechaSorteo ? new Date(r.fechaSorteo) : null;
  const fs = d && !isNaN(d) ? d.toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
  const v = money(r.valor).replace(/\s/g, '');
  return `<section class="card hero">
    <div class="izq">
      <h1>${esc(r.titulo)}</h1>
      <div class="premio${(r.premio || '').length > 24 ? ' lg' : ''}">🎁 ${esc(r.premio || 'Premio por anunciar')}</div>
      <div class="chips">
        <span>🎰 Últimas ${r.cifras} cifras de la ${esc(r.loteria || 'lotería por definir')}</span>
        ${fs ? `<span>📅 ${esc(fs)}</span>` : ''}
      </div>
      ${r.resolucion ? `<div class="mu">Autorización: ${esc(r.resolucion)}</div>` : ''}
    </div>
    <div class="der"><small>VALOR</small><b class="${v.length > 7 ? 'lg' : ''}">${esc(v)}</b><span>por número</span></div>
  </section>`;
}
function avisoEstado(r) {
  const agotada = Object.keys(r.ocupados || {}).length >= 10 ** r.cifras;
  if (agotada && (r.estado === 'abierta' || r.estado === 'cerrada'))
    return `<div class="card aviso" style="background:linear-gradient(135deg,#fde68a,#f59e0b);border:none;color:#3b2300;font-size:1.1rem">🎉 ¡RIFA AGOTADA! 🎉<div style="font-size:.85rem;font-weight:500">Gracias a todos. Juega con la ${esc(r.loteria)}. ¡Mucha suerte! 🍀</div></div>`;
  if (r.estado === 'borrador') return `<div class="card aviso">⏳ Esta rifa todavía no está abierta.</div>`;
  if (r.estado === 'cerrada') return `<div class="card aviso">🔒 Ventas cerradas · esperando el sorteo</div>`;
  if (r.estado === 'sorteada' && r.resultado) {
    const x = r.resultado;
    return `<div class="card" style="text-align:center"><div class="mu">La ${esc(r.loteria)} jugó <b>${esc(x.numeroLoteria)}</b></div>
      <div class="mu" style="margin-top:6px">Número ganador</div><div class="big">${esc(x.ganador)}</div>
      <div>${x.vendido ? `🎉 ¡Número vendido!${x.iniciales ? ` Ganó <b>${esc(x.iniciales)}</b>` : ''} El organizador contactará al ganador.` : 'No se vendió: el premio queda para el organizador.'}</div></div>`;
  }
  return '';
}
function pagosHTML(r) {
  if (!r.pagos?.length) return '<p class="mu">El organizador aún no ha configurado los medios de pago.</p>';
  return r.pagos.map(p => `<div class="pago"><div><div class="mu">${esc(p.tipo)}${p.titular ? ' · ' + esc(p.titular) : ''}</div>
    <b style="font-size:1.1rem;word-break:break-all">${esc(p.dato)}</b></div>
    <button class="sm btn2" style="flex:0 0 auto" data-copy="${esc(p.dato)}">Copiar</button></div>`).join('');
}

// ---------- boletas guardadas en este celular ----------
const LS = 'rifas_boletas';
const misBoletas = () => { try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch { return []; } };
const guardarBoleta = b => { try { const l = misBoletas().filter(x => x.b !== b.b); l.unshift(b); localStorage.setItem(LS, JSON.stringify(l.slice(0, 30))); } catch { } };

// ======================================================================
// VISTA PÚBLICA: tablero de números
// ======================================================================
function vistaPublica(id) {
  const ref = doc(db, 'rifas', id);
  let r = null, sel = new Set(), bloque = 0, primera = true;
  main.innerHTML = '<p class="mu">Cargando rifa…</p>';
  const bar = document.createElement('div'); bar.className = 'bar hide';
  bar.innerHTML = '<div style="min-width:0"><b id="bn"></b><div class="mu" id="bt"></div></div><button id="bgo" style="flex:0 0 auto">Apartar</button>';
  document.body.appendChild(bar);
  $('bgo').onclick = () => modal();

  subs.push(onSnapshot(ref, s => {
    if (!s.exists()) { main.innerHTML = '<div class="card"><h2>Rifa no encontrada</h2><p class="mu">Revisa el link.</p></div>'; bar.remove(); return; }
    r = s.data(); color(r);
    if (primera) { primera = false; armar(); }
    $('hdr').innerHTML = hero(r);
    $('est').innerHTML = avisoEstado(r);
    $('reg').innerHTML = r.reglas ? `<section class="card"><h2>Reglas</h2><div style="white-space:pre-wrap">${esc(r.reglas)}</div></section>` : '';
    $('maxr').textContent = r.maxReserva;
    pintarBloques(); pintar();
  }, err => { main.innerHTML = `<div class="card">No se pudo cargar la rifa: ${esc(err.message)}</div>`; }));

  function armar() {
    main.innerHTML = `<div id="hdr"></div><div id="est"></div>
      <section class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0;flex:2">Escoge tus números</h2>
      <span class="mu" id="libres" style="text-align:right"></span></div>
      <div id="blq"></div><div id="grid" class="grid" style="margin-top:10px"></div>
      <p class="mu" style="margin:10px 0 0">Los números en gris ya están ocupados. Máximo <span id="maxr"></span> por reserva.</p></section>
      <div id="reg"></div><div id="mis"></div>`;
    $('grid').addEventListener('click', e => {
      const b = e.target.closest('.n'); if (!b || b.disabled) return;
      const k = b.dataset.n;
      if (sel.has(k)) sel.delete(k);
      else { if (sel.size >= r.maxReserva) { toast(`Máximo ${r.maxReserva} números por reserva`); return; } sel.add(k); }
      b.classList.toggle('sel', sel.has(k)); barra();
    });
    cargarMisBoletas();
  }
  // Consulta cada boleta guardada: muestra su estado real y olvida las que el organizador liberó
  async function cargarMisBoletas() {
    const mis = misBoletas().filter(x => x.r === id);
    if (!mis.length) return;
    const res = await Promise.all(mis.map(async x => {
      try { const s = await getDoc(doc(db, 'rifas', id, 'reservas', x.b)); return s.exists() ? { ...x, d: s.data() } : { ...x, liberada: true }; }
      catch { return { ...x, error: true }; }
    }));
    const liberadas = new Set(res.filter(x => x.liberada).map(x => x.b));
    if (liberadas.size) try { localStorage.setItem(LS, JSON.stringify(misBoletas().filter(x => !liberadas.has(x.b)))); } catch { }
    const vivas = res.filter(x => !x.liberada);
    if (!vivas.length) { $('mis').innerHTML = ''; return; }
    $('mis').innerHTML = `<section class="card"><h2>Mis boletas en este celular</h2>${vivas.map(x => {
      const nums = x.d ? x.d.numeros : (x.nums || []);
      const pill = !x.d ? '' : x.d.estado === 'pagado'
        ? '<span class="pill p-ok" style="flex:0 0 auto">✅ Pagada</span>'
        : '<span class="pill p-warn" style="flex:0 0 auto">⏳ Pendiente</span>';
      return `<a class="item row" style="justify-content:space-between;text-decoration:none;color:inherit" href="${linkBoleta(id, x.b)}">
        <span style="flex:3">Números <b>${esc(nums.join(', '))}</b>${x.d ? ` · ${money(x.d.total)}` : ''}</span>${pill}</a>`;
    }).join('')}</section>`;
  }
  function pintarBloques() {
    const c = r.cifras;
    if (c <= 2) { $('blq').innerHTML = ''; return; }
    const nb = 10 ** c / 100; if (bloque >= nb) bloque = 0;
    if ($('selb') && $('selb').options.length === nb) return;
    let o = ''; for (let i = 0; i < nb; i++) o += `<option value="${i}" ${i === bloque ? 'selected' : ''}>${pad(i * 100, c)} – ${pad(i * 100 + 99, c)}</option>`;
    $('blq').innerHTML = `<label>Bloque de números</label><select id="selb">${o}</select>`;
    $('selb').onchange = e => { bloque = +e.target.value; pintar(); };
  }
  function pintar() {
    const c = r.cifras, total = 10 ** c, oc = r.ocupados || {}, abierta = r.estado === 'abierta', gan = r.resultado?.ganador;
    for (const k of [...sel]) if (oc[k]) { sel.delete(k); toast(`El ${k} lo acaba de apartar otra persona`); }
    if (!abierta) sel.clear();
    const ini = c > 2 ? bloque * 100 : 0, fin = c > 2 ? ini + 100 : total;
    let h = '';
    for (let i = ini; i < fin; i++) {
      const k = pad(i, c), o = !!oc[k];
      h += `<button class="n${o ? ' oc' : ''}${sel.has(k) ? ' sel' : ''}${gan === k ? ' win' : ''}" data-n="${k}"${o || !abierta ? ' disabled' : ''}>${k}</button>`;
    }
    const g = $('grid'); g.className = `grid c${c}`; g.innerHTML = h;
    $('libres').textContent = `${Math.max(0, total - Object.keys(oc).length)} libres de ${total}`;
    barra();
  }
  function barra() {
    if (!sel.size) { bar.classList.add('hide'); return; }
    bar.classList.remove('hide');
    const n = [...sel].sort();
    $('bn').textContent = `${n.length} número${n.length > 1 ? 's' : ''}: ${n.join(', ')}`;
    $('bt').textContent = `Total ${money(n.length * r.valor)}`;
  }
  function modal() {
    const nums = [...sel].sort(); if (!nums.length) return;
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="card"><h2>Apartar números</h2>
      <p style="margin:0">Números: <b>${nums.join(', ')}</b></p><p class="precio" style="margin:4px 0 0">${money(nums.length * r.valor)}</p>
      <label for="fn">Nombre completo</label><input id="fn" maxlength="80" autocomplete="name">
      <label for="fc">Celular (WhatsApp)</label><input id="fc" inputmode="tel" maxlength="20" autocomplete="tel" placeholder="3001234567">
      <p class="mu">Tus números quedan apartados hasta que el organizador confirme tu pago.</p>
      <div class="row"><button class="btn2" id="fx">Cancelar</button><button id="fok">Apartar</button></div></div>`;
    document.body.appendChild(m);
    m.addEventListener('click', e => { if (e.target === m) m.remove(); });
    $('fx').onclick = () => m.remove();
    $('fok').onclick = async () => {
      const nombre = $('fn').value.trim().replace(/\s+/g, ' ');
      const cel = $('fc').value.replace(/[^\d+]/g, '');
      if (nombre.length < 3) return toast('Escribe tu nombre completo');
      if (cel.replace(/\D/g, '').length < 7) return toast('Escribe un celular válido');
      const b = $('fok'); b.disabled = true; b.textContent = 'Apartando…';
      const resRef = doc(collection(db, 'rifas', id, 'reservas'));
      try {
        await runTransaction(db, async tx => {
          const s = await tx.get(ref); const d = s.data();
          if (d.estado !== 'abierta') throw new Error('La rifa no está abierta');
          const oc = d.ocupados || {}; const tom = nums.filter(k => oc[k]);
          if (tom.length) throw new Error(`Ya los apartaron: ${tom.join(', ')}`);
          if (nums.length > d.maxReserva) throw new Error(`Máximo ${d.maxReserva} números`);
          const args = []; nums.forEach(k => args.push(new FieldPath('ocupados', k), true));
          tx.update(ref, ...args);
          tx.set(resRef, { nombre, celular: cel, numeros: nums, total: nums.length * d.valor, estado: 'pendiente', creada: serverTimestamp() });
        });
        guardarBoleta({ r: id, b: resRef.id, nums, titulo: r.titulo });
        // Primero la boleta con los datos de pago; WhatsApp se abre después, cuando la persona ya pagó
        location.href = linkBoleta(id, resRef.id) + '&nuevo=1';
      } catch (e) {
        b.disabled = false; b.textContent = 'Apartar';
        toast(/permission/i.test(e.message) ? 'No se pudo apartar. Recarga e intenta de nuevo.' : e.message, 4000);
      }
    };
  }
}

    if (!x) {
      main.innerHTML = hero(r) + `<div class="card"><h2>Reserva no disponible</h2><p>El organizador liberó esta reserva; esos números volvieron a quedar disponibles.</p><a class="btn" href="${tablero}">Ir al tablero</a></div>`;

    main.innerHTML = hero(r) + avisoEstado(r) + (ok
      ? boleta + `<section class="card"><b>✓ Tu pago fue confirmado.</b> Ya estás participando. ¡Suerte!</section>`
      : `${nuevo ? `<div class="card aviso" style="background:#dcfce7;border-color:#bbf7d0;color:var(--ok)">✅ Tus números <b>${esc(x.numeros.join(', '))}</b> quedaron apartados. Ahora paga y envía el comprobante.</div>` : ''}

        <p class="mu" style="margin:6px 0 4px">Transfiere desde Nequi o tu banco a uno de estos medios. Toca <b>Copiar</b> y pégalo en tu app.</p>
        ${pagosHTML(r)}</section>
      ${r.whatsapp ? `<section class="card"><div class="paso">2</div><h2 style="display:inline">Envía el comprobante</h2>
        <p class="mu" style="margin:6px 0 10px">Cuando hayas pagado, toca el botón y <b>adjunta la captura</b> del comprobante en el chat.</p>
        <a class="btn" style="width:100%;font-size:1rem;padding:14px" target="_blank" rel="noopener" href="${esc(wa(r.whatsapp, msg))}">✅ Ya pagué: enviar comprobante por WhatsApp</a></section>` : ''}
      <section class="card"><div class="paso">${r.whatsapp ? 3 : 2}</div><h2 style="display:inline">Espera la confirmación</h2>
        <p class="mu" style="margin:6px 0 0">El organizador revisa el pago y esta página cambia sola a <b>✅ Pago confirmado</b>.</p></section>
      ${boleta}`) + `
      <section class="card"><p class="mu" style="margin-top:0">Guarda este link para consultar tu boleta:</p>
        <div class="row"><button class="btn2 sm" data-copy="${esc(link)}">Copiar link de mi boleta</button><a class="btn btn2 sm" href="${tablero}">Ver tablero</a></div></section>`;
  };
  subs.push(onSnapshot(doc(db, 'rifas', id), s => { r = s.exists() ? s.data() : null; pintar(); }, () => { r = null; pintar(); }));
  subs.push(onSnapshot(doc(db, 'rifas', id, 'reservas', bid), s => {
    x = s.exists() ? { id: s.id, ...s.data() } : null;
    if (x) guardarBoleta({ r: id, b: bid, nums: x.numeros, titulo: r?.titulo || '' });
    pintar();
  }, () => { x = null; pintar(); }));
}

function panelRifa(id, u) {
  const ref = doc(db, 'rifas', id);
  let r = null, res = [], resListo = false, listo = false, numLot = '';
  const quitar = nums => nums.flatMap(k => [new FieldPath('ocupados', k), deleteField()]);
  main.innerHTML = '<p class="mu">Cargando…</p>';

  subs.push(onSnapshot(ref, s => {

  subs.push(onSnapshot(collection(db, 'rifas', id, 'reservas'), s => {

  function armar() {

      <h1 id="tt" style="margin:6px 0 12px"></h1>

        <a class="btn sm btn2" id="wsh" target="_blank" rel="noopener">WhatsApp</a>
        <a class="btn sm btn2" href="${link}" target="_blank" rel="noopener">Ver como participante</a></div></section>
      <section class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0;flex:3">Estado</h2><span id="pe" style="flex:0 0 auto"></span></div><div id="acc" style="margin-top:10px"></div></section>
      <section class="card"><h2>Resumen</h2><div class="stats" id="st"></div></section>
      <section class="card"><h2>Por confirmar <span class="mu" id="np"></span></h2>
        <p class="mu" style="margin-top:-6px">Las más antiguas primero. Confirma solo cuando veas el dinero en tu cuenta.</p><div id="pend"></div></section>
      <section class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0;flex:3">Pagados <span class="mu" id="npg"></span></h2>
        <button class="sm btn2" id="csv" style="flex:0 0 auto">📊 Descargar Excel</button></div>
        <input id="bus" placeholder="Buscar nombre, celular o número" style="margin-top:10px"><div id="pag"></div></section>
      <div id="huer"></div>
      <section class="card"><h2>📢 Mensaje a los compradores</h2>
        <p class="mu" style="margin-top:-6px">WhatsApp no permite envíos masivos: toca <b>Enviar</b> en cada persona, envía y vuelve para la siguiente.</p>
        <label>Enviar a</label><select id="m_fil"><option value="todos">Todos</option><option value="pagado">Solo pagados</option><option value="pendiente">Solo pendientes</option></select>
        <label>Mensaje <span class="mu" style="font-weight:400">— usa {nombre}, {numeros}, {rifa}, {loteria}, {fecha}</span></label>
        <textarea id="m_txt" rows="6"></textarea>
        <div id="m_lista" style="margin-top:8px"></div>
        <button class="sm btn2" id="vcf" style="width:100%;margin-top:10px">📇 Descargar contactos (.vcf) para lista de difusión</button></section>
      <section class="card" id="sorteo"></section>
      <section class="card"><h2>Configuración</h2><div id="cfg"></div></section>
      <section class="card"><h2>Eliminar rifa</h2><p class="mu">Borra la rifa y todas sus reservas. No se puede deshacer.</p><button class="btnbad sm" id="del">Eliminar rifa</button></section>`;
    $('bus').oninput = pintar;
    $('csv').onclick = () => exportar().catch(e => toast('Error al crear el Excel: ' + e.message, 5000));
    $('vcf').onclick = contactos;
    $('m_txt').value = '¡Hola {nombre}! 👋😊\nTe recuerdo que la *{rifa}* juega el {fecha} con la {loteria}. 🎰\n🔢 Tus números: *{numeros}*\n\n¡Mucha suerte! 🍀';
    $('m_txt').oninput = pintarMasivo; $('m_fil').onchange = pintarMasivo;
    $('m_lista').addEventListener('click', e => { const a = e.target.closest('a[data-cel]'); if (a) { enviados.add(a.dataset.cel); setTimeout(pintarMasivo, 300); } });
    $('del').onclick = eliminar;
    main.addEventListener('click', accion);
  }

  function pintar() {
    if (!r || !listo) return;
    const c = r.cifras, total = 10 ** c, oc = r.ocupados || {};
    $('tt').textContent = r.titulo;
    $('wsh').href = `https://wa.me/?text=${encodeURIComponent(`🎟️ ${r.titulo}\n🎁 ${r.premio}\n💵 ${money(r.valor)} por número\nEscoge tus números aquí: ${BASE}?r=${id}`)}`;
    $('pe').innerHTML = pillEstado(r.estado);
    const pend = res.filter(x => x.estado !== 'pagado').sort((a, b) => (aFecha(a.creada) || 0) - (aFecha(b.creada) || 0));
    const pag = res.filter(x => x.estado === 'pagado').sort((a, b) => (aFecha(b.pagadoEn) || 0) - (aFecha(a.pagadoEn) || 0));
    const nPend = pend.reduce((s, x) => s + x.numeros.length, 0), nPag = pag.reduce((s, x) => s + x.numeros.length, 0);

    $('acc').innerHTML = {
      borrador: `<p class="mu" style="margin-top:0">Configura la rifa abajo y luego abre las ventas.</p><button data-est="abierta">Abrir ventas</button>`,
      abierta: `<p class="mu" style="margin-top:0">Los participantes pueden apartar números.</p><button data-est="cerrada">Cerrar ventas</button>`,
      cerrada: `<p class="mu" style="margin-top:0">Nadie puede apartar números. Ya puedes registrar el resultado.</p><button class="btn2" data-est="abierta">Reabrir ventas</button>`,
      sorteada: `<p class="mu" style="margin-top:0">Resultado publicado.</p><button class="btn2" data-est="deshacer">Deshacer resultado</button>`
    }[r.estado] || '';

    $('st').innerHTML = [
      ['Pagados', `${nPag} núm.`], ['Recaudado', money(pag.reduce((s, x) => s + x.total, 0))],
      ['Por confirmar', `${nPend} núm.`], ['Pendiente', money(pend.reduce((s, x) => s + x.total, 0))],
      ['Libres', `${Math.max(0, total - Object.keys(oc).length)} de ${total}`]
    ].map(([k, v]) => `<div class="stat"><span class="mu">${k}</span><b>${v}</b></div>`).join('');

    $('np').textContent = `(${pend.length})`; $('npg').textContent = `(${pag.length})`;
    const venc = vencidas(pend);
    const nv = venc.reduce((s, x) => s + x.numeros.length, 0);
    $('pend').innerHTML = (venc.length ? `<div class="venc"><b>${venc.length} reserva${venc.length > 1 ? 's' : ''} vencida${venc.length > 1 ? 's' : ''}</b>
        <div class="mu">Más de ${horasVence()} h sin confirmar · números ${esc(venc.flatMap(x => x.numeros).join(', '))}</div>
        <button class="sm btnbad" style="width:100%;margin-top:8px" data-venc="1">Liberar vencidas (${nv} número${nv > 1 ? 's' : ''})</button></div>` : '')
      + (pend.length ? pend.map(x => item(x, true)).join('') : '<p class="mu">No hay reservas pendientes.</p>');
    const q = ($('bus').value || '').toLowerCase().trim();
    const pf = q ? pag.filter(x => `${x.nombre} ${x.celular} ${x.numeros.join(' ')}`.toLowerCase().includes(q)) : pag;
    $('pag').innerHTML = pf.length ? pf.map(x => item(x, false)).join('') : '<p class="mu">Sin resultados.</p>';

    const hu = huerfanos();
    $('huer').innerHTML = hu.length ? `<section class="card"><h2>Números bloqueados sin reserva</h2>
      <p class="mu">Aparecen ocupados pero no tienen comprador asociado (error de conexión o uso indebido del link).</p>
      <b>${esc(hu.join(', '))}</b><div style="margin-top:8px"><button class="sm btnbad" data-huer="1">Liberarlos</button></div></section>` : '';
    pintarSorteo(pend, pag);
    pintarMasivo();
  }
  // ---------- mensajes a compradores ----------
  const enviados = new Set();
  function compradores(filtro) {
    const m = new Map();
    res.filter(x => filtro === 'todos' || (filtro === 'pagado' ? x.estado === 'pagado' : x.estado !== 'pagado')).forEach(x => {
      const k = waNum(x.celular);
      if (!m.has(k)) m.set(k, { nombre: x.nombre, celular: x.celular, numeros: [] });
      m.get(k).numeros.push(...x.numeros);
    });
    return [...m.values()].map(c => ({ ...c, numeros: c.numeros.sort() })).sort((a, b) => a.nombre.localeCompare(b.nombre));
  }
  function pintarMasivo() {
    if (!$('m_lista')) return;
    const lista = compradores($('m_fil').value), txt = $('m_txt').value;
    const d = r.fechaSorteo ? new Date(r.fechaSorteo) : null;
    const fs = d && !isNaN(d) ? d.toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : 'día del sorteo';
    const armarMsg = c => txt.replaceAll('{nombre}', c.nombre.split(' ')[0]).replaceAll('{numeros}', c.numeros.join(', '))
      .replaceAll('{rifa}', r.titulo).replaceAll('{loteria}', r.loteria || 'lotería').replaceAll('{fecha}', fs);
    const n = lista.filter(c => enviados.has(waNum(c.celular))).length;
    $('m_lista').innerHTML = !lista.length ? '<p class="mu">No hay compradores en este grupo.</p>'
      : `<p class="mu" style="margin:0 0 4px">${n} de ${lista.length} enviados</p>` + lista.map(c => {
        const ok = enviados.has(waNum(c.celular));
        return `<div class="item row" style="justify-content:space-between;padding:8px 0${ok ? ';opacity:.55' : ''}">
          <div style="flex:3;min-width:0"><b>${esc(c.nombre)}</b><div class="mu">${esc(c.numeros.join(', '))}</div></div>
          <a class="btn sm${ok ? ' btn2' : ''}" style="flex:0 0 auto" data-cel="${esc(waNum(c.celular))}" target="_blank" rel="noopener" href="${esc(wa(c.celular, armarMsg(c)))}">${ok ? '✓ Enviado' : 'Enviar'}</a></div>`;
      }).join('');
  }
  function contactos() {
    const lista = compradores('todos'); if (!lista.length) return toast('Aún no hay compradores');
    const e = v => String(v).replace(/[\\;,]/g, m => '\\' + m);
    const vcf = lista.map(c => ['BEGIN:VCARD', 'VERSION:3.0', `FN:${e(c.nombre)} (Rifa)`, `N:;${e(c.nombre)} (Rifa);;;`,
      `TEL;TYPE=CELL:+${waNum(c.celular)}`, `NOTE:${e(r.titulo)} – números ${c.numeros.join(' ')}`, 'END:VCARD'].join('\r\n')).join('\r\n');
    descargar(new Blob([vcf], { type: 'text/vcard;charset=utf-8' }), `contactos-${archivo()}.vcf`);
    toast(`${lista.length} contactos descargados`);
  }
  const archivo = () => (r.titulo || 'rifa').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w]+/g, '-').replace(/^-|-$/g, '');
  function descargar(blob, nombre) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); }
  function huerfanos() {
    if (!resListo) return [];
    const usados = new Set(res.flatMap(x => x.numeros));
    return Object.keys(r.ocupados || {}).filter(k => !usados.has(k)).sort();
  }
  const horasVence = () => r.horasVence > 0 ? r.horasVence : 12;
  const esVencida = x => x.estado !== 'pagado' && aFecha(x.creada) && (Date.now() - aFecha(x.creada)) > horasVence() * 3600000;
  const vencidas = pend => pend.filter(esVencida);
  function item(x, pendiente) {
    const nom = String(x.nombre || '').trim().split(/\s+/)[0] || '';
    const lb = linkBoleta(id, x.id);
    const d = r.fechaSorteo ? new Date(r.fechaSorteo) : null;
    const fs = d && !isNaN(d) ? d.toLocaleDateString('es-CO', { day: 'numeric', month: 'short' }) : '';
    const medios = (r.pagos || []).map(p => `• ${p.tipo}: *${p.dato}*${p.titular ? ` (${p.titular})` : ''}`).join('\n');
    const msg = pendiente
      ? `¡Hola ${nom}! 👋😊\nGracias por participar en la *${r.titulo}* 🎟️\n\n` +
        `🔢 Tus números: *${x.numeros.join(', ')}*\n💵 Total a pagar: *${money(x.total)}*\n\n` +
        (medios ? `💳 *Puedes pagar a:*\n${medios}\n\n` : '') +
        `📸 Cuando pagues, envíame la captura del comprobante por aquí.\n🧾 Tu boleta: ${lb}\n\n¡Mucha suerte! 🍀🎉`
      : `¡Hola ${nom}! ✅ Recibí tu pago de *${money(x.total)}*.\n🎟️ ${r.titulo}\n` +
        `🔢 Tus números *${x.numeros.join(', ')}* ya están confirmados.\n` +
        (r.loteria ? `🎰 Juegas con la ${r.loteria}${fs ? ` el ${fs}` : ''}.\n` : '') +
        `🧾 Tu boleta: ${lb}\n\n¡Mucha suerte! 🍀`;
    return `<div class="item"><div class="row" style="justify-content:space-between"><b style="flex:3">${esc(x.nombre)}</b>
      ${pendiente && esVencida(x) ? '<span class="pill p-bad" style="flex:0 0 auto">⌛ Vencida</span>' : ''}
      <span class="mu" style="flex:0 0 auto">${esc(hace(pendiente ? x.creada : x.pagadoEn))}</span></div>
      <div>Números: <b>${esc(x.numeros.join(', '))}</b> · ${money(x.total)}</div>
      <div><a href="${esc(wa(x.celular, msg))}" target="_blank" rel="noopener">${esc(x.celular)} · WhatsApp</a></div>
      <div class="row" style="margin-top:8px">${pendiente
        ? `<button class="sm" data-conf="${esc(x.id)}">Confirmar pago</button>`
        : `<button class="sm btn2" data-desc="${esc(x.id)}">Quitar confirmación</button>`}
        <button class="sm btn2" style="flex:0 0 auto" data-edit="${esc(x.id)}">✏️</button>
        <button class="sm btnbad" data-lib="${esc(x.id)}">Liberar</button></div></div>`;
  }

  async function accion(e) {
    const t = e.target.closest('button'); if (!t) return;
    const d = t.dataset;
    try {
      if (d.est) await cambiarEstado(d.est);
      else if (d.conf) { await updateDoc(doc(db, 'rifas', id, 'reservas', d.conf), { estado: 'pagado', pagadoEn: serverTimestamp() }); toast('Pago confirmado ✓'); }
      else if (d.desc) {
        if (!confirm('¿Quitar la confirmación de pago?')) return;
        await updateDoc(doc(db, 'rifas', id, 'reservas', d.desc), { estado: 'pendiente', pagadoEn: deleteField() });
      }
      else if (d.lib) {
        const x = res.find(y => y.id === d.lib); if (!x) return;
        if (!confirm(`¿Liberar los números ${x.numeros.join(', ')} de ${x.nombre}? Volverán a estar disponibles.`)) return;
        const b = writeBatch(db); b.update(ref, ...quitar(x.numeros)); b.delete(doc(db, 'rifas', id, 'reservas', x.id)); await b.commit();
        toast('Números liberados');
      }
      else if (d.huer) {
        const hu = huerfanos(); if (!hu.length || !confirm(`¿Liberar ${hu.join(', ')}?`)) return;
        await updateDoc(ref, ...quitar(hu)); toast('Liberados');
      }
      else if (d.edit) editar(res.find(y => y.id === d.edit));
      else if (d.venc) {
        const v = vencidas(res.filter(x => x.estado !== 'pagado'));
        if (!v.length) return;
        if (!confirm(`¿Liberar ${v.length} reserva(s) vencida(s)?\n\n${v.map(x => `${x.nombre}: ${x.numeros.join(', ')}`).join('\n')}\n\nRevisa antes que ninguno haya pagado.`)) return;
        const b = writeBatch(db);
        b.update(ref, ...quitar(v.flatMap(x => x.numeros)));
        v.forEach(x => b.delete(doc(db, 'rifas', id, 'reservas', x.id)));
        await b.commit(); toast('Reservas vencidas liberadas');
      }
      else if (d.sort) await guardarSorteo();
    } catch (err) { toast('Error: ' + err.message, 4000); }
  }

  function editar(x) {
    if (!x) return;
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="card"><h2>Editar participante</h2>
      <p class="mu" style="margin:0">Números: <b>${esc(x.numeros.join(', '))}</b></p>
      <label for="en">Nombre</label><input id="en" maxlength="80" value="${esc(x.nombre)}">
      <label for="ec">Celular</label><input id="ec" inputmode="tel" maxlength="20" value="${esc(x.celular)}">
      <div class="row" style="margin-top:14px"><button class="btn2" id="ex">Cancelar</button><button id="eok">Guardar</button></div></div>`;
    document.body.appendChild(m);
    m.addEventListener('click', e => { if (e.target === m) m.remove(); });
    $('ex').onclick = () => m.remove();
    $('eok').onclick = async () => {
      const nombre = $('en').value.trim().replace(/\s+/g, ' '), celular = $('ec').value.replace(/[^\d+]/g, '');
      if (nombre.length < 3) return toast('Nombre muy corto');
      if (celular.replace(/\D/g, '').length < 7) return toast('Celular no válido');
      $('eok').disabled = true;
      try { await updateDoc(doc(db, 'rifas', id, 'reservas', x.id), { nombre, celular }); toast('Datos actualizados ✓'); m.remove(); }
      catch (e) { $('eok').disabled = false; toast(/permission/i.test(e.message) ? 'Sin permiso: publica primero las reglas nuevas en Firebase.' : 'Error: ' + e.message, 5000); }
    };
  }

  async function cambiarEstado(est) {
    if (est === 'abierta' && r.estado === 'borrador') {
      const f = [];
      if (!r.premio) f.push('premio'); if (!r.loteria) f.push('lotería');
      if (!r.pagos?.length) f.push('medios de pago'); if (!r.whatsapp) f.push('WhatsApp');
      if (f.length) return toast('Falta configurar y guardar: ' + f.join(', '), 4500);
    }
    if (est === 'cerrada' && !confirm('¿Cerrar ventas? Nadie podrá apartar más números.')) return;
    if (est === 'deshacer') {
      if (!confirm('¿Deshacer el resultado publicado?')) return;
      await updateDoc(ref, { estado: 'cerrada', resultado: null }); return;
    }
    await updateDoc(ref, { estado: est });
  }

  // ---------- sorteo ----------
  function pintarSorteo(pend, pag) {
    const box = $('sorteo');
    if (r.estado === 'sorteada' && r.resultado) {
      const x = r.resultado; const w = pag.find(y => y.numeros.includes(x.ganador));
      box.innerHTML = `<h2>Resultado</h2><div class="big">${esc(x.ganador)}</div><p>La lotería jugó ${esc(x.numeroLoteria)}. ${w
        ? `Ganador: <b>${esc(w.nombre)}</b> · <a href="${esc(wa(w.celular, `¡Hola ${w.nombre}! Ganaste la rifa "${r.titulo}" con el número ${x.ganador}.`))}" target="_blank" rel="noopener">${esc(w.celular)}</a>`
        : 'No se vendió: el premio queda para el organizador.'}</p>
        <a class="btn" style="width:100%" target="_blank" rel="noopener" href="${esc(`https://wa.me/?text=${encodeURIComponent(
          `🎉 *Resultado – ${r.titulo}*\n🎰 La ${r.loteria} jugó *${x.numeroLoteria}*\n🏆 Número ganador: *${x.ganador}*\n` +
          (x.vendido ? `¡Felicitaciones${x.iniciales ? ' ' + x.iniciales : ''}! 🎁 ${r.premio}` : 'El número no se vendió: el premio queda para el organizador.') +
          `\n\nVer tablero: ${BASE}?r=${id}`)}`)}">📣 Compartir resultado por WhatsApp</a>`;
      return;
    }
    if (r.estado !== 'cerrada') { box.innerHTML = `<h2>Sorteo</h2><p class="mu">Cierra las ventas para registrar el resultado de la lotería.</p>`; return; }
    box.innerHTML = `<h2>Registrar resultado</h2>
      ${pend.length ? `<p style="color:var(--warn)"><b>Hay ${pend.length} reserva(s) sin confirmar.</b> Confírmalas o libéralas antes del sorteo.</p>` : ''}
      <label>Número del premio mayor de la ${esc(r.loteria)}</label><input id="lot" inputmode="numeric" value="${esc(numLot)}" placeholder="Ej: 4507">
      <div id="prev" class="mu" style="margin:8px 0"></div><button data-sort="1">Publicar resultado</button>`;
    const prev = () => { numLot = $('lot').value.replace(/\D/g, ''); const g = ganador(); $('prev').innerHTML = g ? vistaGanador(g) : ''; };
    $('lot').oninput = prev; prev();
  }
  const ganador = () => numLot.length >= r.cifras ? numLot.slice(-r.cifras) : null;
  const dueno = g => res.find(y => y.numeros.includes(g)) || null;
  function vistaGanador(g) {
    const x = dueno(g);
    return `Número ganador: <b>${g}</b> — ${!x ? 'no se vendió (el premio queda para el organizador)'
      : x.estado === 'pagado' ? `vendido a <b>${esc(x.nombre)}</b>`
        : `<span style="color:var(--bad)">apartado por ${esc(x.nombre)} pero SIN pago confirmado</span>`}`;
  }
  async function guardarSorteo() {
    const g = ganador(); if (!g) return toast(`Escribe al menos ${r.cifras} cifras`);
    const x = dueno(g);
    if (x && x.estado !== 'pagado') return toast('Ese número está apartado sin pago confirmado. Confírmalo o libéralo primero.', 4500);
    if (!confirm(`¿Publicar como ganador el ${g}?`)) return;
    await updateDoc(ref, { estado: 'sorteada', resultado: { numeroLoteria: numLot, ganador: g, vendido: !!x, iniciales: x ? iniciales(x.nombre) : '', fecha: serverTimestamp() } });
  }

  // ---------- configuración ----------
  function formulario() {
    const f = $('cfg');
    const bloqueado = Object.keys(r.ocupados || {}).length > 0;
    f.innerHTML = `
      <label>Título</label><input id="c_tit" maxlength="80" value="${esc(r.titulo)}">
      <label>Premio</label><input id="c_pre" maxlength="140" value="${esc(r.premio)}" placeholder="Ej: Moto AKT 125 / $1.000.000 en efectivo">
      <div class="row"><div><label>Valor por número (COP)</label><input id="c_val" type="number" min="100" step="100" value="${r.valor}"></div>
        <div><label>Máx. números por reserva</label><input id="c_max" type="number" min="1" max="100" value="${r.maxReserva}"></div></div>
      <label>Marcar reserva como vencida después de (horas)</label><input id="c_hv" type="number" min="1" max="720" value="${r.horasVence > 0 ? r.horasVence : 12}">
      <p class="mu" style="margin:4px 0 0">Las reservas no se borran solas: solo se marcan para que las revises y las liberes con un toque.</p>
      <label>Lotería con la que juega</label><input id="c_lot" maxlength="60" value="${esc(r.loteria)}" placeholder="Ej: Lotería del Cauca">
      <div class="row"><div><label>Cifras</label><select id="c_cif" ${bloqueado ? 'disabled' : ''}>${[2, 3, 4].map(n =>
        `<option value="${n}" ${r.cifras === n ? 'selected' : ''}>${n} últimas (${pad(0, n)}–${'9'.repeat(n)})</option>`).join('')}</select></div>
        <div><label>Fecha y hora del sorteo</label><input id="c_fec" type="datetime-local" value="${esc(r.fechaSorteo)}"></div></div>
      ${bloqueado ? '<p class="mu">Las cifras ya no se pueden cambiar porque hay números apartados.</p>' : ''}
      <label>WhatsApp del organizador</label><input id="c_wa" inputmode="tel" value="${esc(r.whatsapp)}" placeholder="3001234567">
      <h3>Medios de pago</h3><div id="c_pagos"></div><button class="btn2 sm" id="c_add" type="button">+ Agregar medio de pago</button>
      <label>Reglas / condiciones</label><textarea id="c_reg" rows="4" maxlength="1500">${esc(r.reglas)}</textarea>
      <label>N.º de resolución o autorización (opcional)</label><input id="c_res" maxlength="120" value="${esc(r.resolucion)}">
      <label>Color</label><input id="c_col" type="color" value="${esc(r.color || COLOR)}" style="height:44px;padding:4px">
      <button id="c_ok" style="width:100%;margin-top:14px">Guardar cambios</button>`;
    const pagos = $('c_pagos');
    const fila = (p = { tipo: 'Llave Bre-B', dato: '', titular: '' }) => {
      const d = document.createElement('div'); d.className = 'pago'; d.style.display = 'block';
      d.innerHTML = `<div class="row"><select class="p_t">${TIPOS_PAGO.map(t => `<option ${t === p.tipo ? 'selected' : ''}>${t}</option>`).join('')}</select>
        <button type="button" class="sm btnbad p_x" style="flex:0 0 auto">✕</button></div>
        <input class="p_d" placeholder="Llave, número o cuenta" value="${esc(p.dato)}" style="margin-top:6px">
        <input class="p_n" placeholder="Nombre del titular" value="${esc(p.titular)}" style="margin-top:6px">`;
      d.querySelector('.p_x').onclick = () => d.remove();
      pagos.appendChild(d);
    };
    (r.pagos || []).forEach(p => fila(p));
    $('c_add').onclick = () => fila();
    $('c_ok').onclick = async () => {
      const valor = Math.round(+$('c_val').value), max = Math.round(+$('c_max').value), cif = +$('c_cif').value, hv = Math.round(+$('c_hv').value);
      if (!(hv >= 1 && hv <= 720)) return toast('Horas para vencer: entre 1 y 720');
      if (!(valor > 0)) return toast('Valor por número no válido');
      if (!(max >= 1 && max <= 100)) return toast('Máximo por reserva: entre 1 y 100');
      if (cif !== r.cifras && Object.keys(r.ocupados || {}).length) return toast('No puedes cambiar las cifras con números apartados');
      const ps = [...pagos.children].map(d => ({ tipo: d.querySelector('.p_t').value, dato: d.querySelector('.p_d').value.trim(), titular: d.querySelector('.p_n').value.trim() })).filter(p => p.dato);
      const b = $('c_ok'); b.disabled = true;
      try {
        await updateDoc(ref, {
          titulo: $('c_tit').value.trim() || 'Rifa', premio: $('c_pre').value.trim(), valor, maxReserva: max, horasVence: hv,
          loteria: $('c_lot').value.trim(), cifras: cif, fechaSorteo: $('c_fec').value, whatsapp: $('c_wa').value.trim(),
          pagos: ps, reglas: $('c_reg').value.trim(), resolucion: $('c_res').value.trim(), color: $('c_col').value
        });
        toast('Guardado ✓');
      } catch (e) { toast('Error: ' + e.message, 4000); }
      finally { b.disabled = false; }
    };
  }

  function cargarExcelJS() {
    if (window.ExcelJS) return Promise.resolve();
    return new Promise((ok, mal) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js'; sc.onload = ok; sc.onerror = () => mal(new Error('sin conexión')); document.head.appendChild(sc); });
  }
  async function exportar() {
    toast('Preparando Excel…'); await cargarExcelJS();
    const C = (/^#[0-9a-f]{6}$/i.test(r.color || '') ? r.color : COLOR).slice(1).toUpperCase();
    const VERDE = 'FFDCFCE7', VERDE_T = 'FF15803D', AMAR = 'FFFEF3C7', AMAR_T = 'FFB45309', GRIS = 'FFE7E5E4';
    const borde = { top: { style: 'thin', color: { argb: GRIS } }, left: { style: 'thin', color: { argb: GRIS } }, bottom: { style: 'thin', color: { argb: GRIS } }, right: { style: 'thin', color: { argb: GRIS } } };
    const fill = c => ({ type: 'pattern', pattern: 'solid', fgColor: { argb: c } });
    const PESOS = '"$"#,##0';
    const wb = new ExcelJS.Workbook(); wb.creator = 'Rifas';
    const ord = res.slice().sort((a, b) => (a.estado === b.estado ? 0 : a.estado === 'pagado' ? -1 : 1) || (aFecha(a.creada) || 0) - (aFecha(b.creada) || 0));
    const pag = ord.filter(x => x.estado === 'pagado'), pen = ord.filter(x => x.estado !== 'pagado');
    const total = 10 ** r.cifras, oc = Object.keys(r.ocupados || {}).length;
    const d = r.fechaSorteo ? new Date(r.fechaSorteo) : null;
    const fs = d && !isNaN(d) ? d.toLocaleString('es-CO', { dateStyle: 'long', timeStyle: 'short' }) : 'por definir';

    // ---- Hoja Ventas ----
    const ws = wb.addWorksheet('Ventas', { views: [{ state: 'frozen', ySplit: 8, showGridLines: false }] });
    ws.columns = [{ width: 5 }, { width: 13 }, { width: 28 }, { width: 15 }, { width: 24 }, { width: 7 }, { width: 13 }, { width: 19 }, { width: 19 }];
    ws.mergeCells('A1:I1'); const t = ws.getCell('A1');
    t.value = `🎟️  ${r.titulo}`; t.font = { size: 18, bold: true, color: { argb: 'FFFFFFFF' } }; t.fill = fill('FF' + C); t.alignment = { vertical: 'middle', horizontal: 'center' }; ws.getRow(1).height = 36;
    ws.mergeCells('A2:I2'); const s2 = ws.getCell('A2');
    s2.value = `🎁 ${r.premio || ''}   ·   🎰 ${r.loteria || ''} (${r.cifras} cifras)   ·   📅 ${fs}   ·   💵 ${money(r.valor)} por número`;
    s2.font = { size: 11, color: { argb: 'FF44403C' } }; s2.alignment = { horizontal: 'center', wrapText: true }; ws.getRow(2).height = 22;
    const resumen = [['Números pagados', pag.reduce((a, x) => a + x.numeros.length, 0), null, VERDE, VERDE_T], ['Recaudado', pag.reduce((a, x) => a + x.total, 0), PESOS, VERDE, VERDE_T],
      ['Por confirmar', pen.reduce((a, x) => a + x.numeros.length, 0), null, AMAR, AMAR_T], ['Pendiente', pen.reduce((a, x) => a + x.total, 0), PESOS, AMAR, AMAR_T], ['Libres', `${total - oc} de ${total}`, null, 'FFF5F5F4', 'FF57534E']];
    const colsRes = ['B', 'C', 'E', 'G', 'I'];
    resumen.forEach(([k, v, f, bg, fg], i) => {
      const a = ws.getCell(`${colsRes[i]}4`), b = ws.getCell(`${colsRes[i]}5`);
      a.value = k; a.font = { size: 9, bold: true, color: { argb: fg } }; b.value = v; b.font = { size: 14, bold: true, color: { argb: fg } };
      if (f) b.numFmt = f;
      [a, b].forEach(c => { c.fill = fill(bg); c.alignment = { horizontal: 'center', vertical: 'middle' }; });
    });
    ws.getRow(5).height = 26;
    const H = ['#', 'Estado', 'Nombre', 'Celular', 'Números', 'Cant.', 'Total', 'Apartado', 'Pagado'];
    const hr = ws.getRow(8); hr.values = H; hr.height = 22;
    hr.eachCell(c => { c.font = { bold: true, color: { argb: 'FFFFFFFF' } }; c.fill = fill('FF' + C); c.alignment = { horizontal: 'center', vertical: 'middle' }; c.border = borde; });
    ord.forEach((x, i) => {
      const okp = x.estado === 'pagado';
      const row = ws.addRow([i + 1, okp ? '✅ Pagado' : '⏳ Pendiente', x.nombre, x.celular, x.numeros.join(', '), x.numeros.length, x.total, aFecha(x.creada) || '', aFecha(x.pagadoEn) || '']);
      row.eachCell({ includeEmpty: true }, (c, n) => { c.border = borde; c.alignment = { vertical: 'middle', horizontal: [3, 5].includes(n) ? 'left' : 'center', wrapText: n === 5 }; if (i % 2) c.fill = fill('FFFAFAF9'); });
      const e = row.getCell(2); e.fill = fill(okp ? VERDE : AMAR); e.font = { bold: true, color: { argb: okp ? VERDE_T : AMAR_T } };
      row.getCell(7).numFmt = PESOS; row.getCell(8).numFmt = 'dd/mm/yyyy hh:mm'; row.getCell(9).numFmt = 'dd/mm/yyyy hh:mm';
    });
    if (ord.length) {
      const fin = 8 + ord.length, tr = ws.addRow(['', '', 'TOTAL', '', '', { formula: `SUM(F9:F${fin})` }, { formula: `SUM(G9:G${fin})` }]);
      tr.eachCell(c => { c.font = { bold: true }; c.border = { top: { style: 'medium', color: { argb: 'FF' + C } } }; });
      tr.getCell(7).numFmt = PESOS; tr.getCell(6).alignment = tr.getCell(7).alignment = { horizontal: 'center' };
      ws.autoFilter = { from: 'A8', to: `I${fin}` };
    }
    ws.pageSetup = { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 };

    // ---- Hoja Tablero ----
    const wt = wb.addWorksheet('Tablero', { views: [{ showGridLines: false }] });
    wt.columns = Array.from({ length: 10 }, () => ({ width: 16 }));
    wt.mergeCells('A1:J1'); const tt = wt.getCell('A1');
    tt.value = `Tablero – ${r.titulo}`; tt.font = { size: 16, bold: true, color: { argb: 'FFFFFFFF' } }; tt.fill = fill('FF' + C); tt.alignment = { horizontal: 'center', vertical: 'middle' }; wt.getRow(1).height = 30;
    wt.mergeCells('A2:J2'); const lg = wt.getCell('A2');
    lg.value = '🟩 Pagado    🟨 Pendiente de pago    ⬜ Libre'; lg.alignment = { horizontal: 'center' }; lg.font = { color: { argb: 'FF57534E' } };
    const dueno = {}; res.forEach(x => x.numeros.forEach(k => { dueno[k] = x; }));
    for (let i = 0; i < total; i++) {
      const k = pad(i, r.cifras), x = dueno[k], c = wt.getCell(4 + Math.floor(i / 10), 1 + (i % 10));
      c.value = x ? { richText: [{ text: k + '\n', font: { bold: true, size: 12, color: { argb: x.estado === 'pagado' ? VERDE_T : AMAR_T } } }, { text: x.nombre, font: { size: 8 } }] }
        : { richText: [{ text: k, font: { bold: true, size: 12, color: { argb: 'FFA8A29E' } } }] };
      c.fill = fill(x ? (x.estado === 'pagado' ? VERDE : AMAR) : 'FFFFFFFF'); c.border = borde;
      c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
    }
    for (let rr = 4; rr < 4 + total / 10; rr++) wt.getRow(rr).height = 34;
    wt.pageSetup = { orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0 };

    const buf = await wb.xlsx.writeBuffer();
    descargar(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `rifa-${archivo()}.xlsx`);
  }

  async function eliminar() {
    if (prompt('Escribe ELIMINAR para borrar la rifa y todas sus reservas') !== 'ELIMINAR') return;
    const lista = res.slice();
    try {
      limpiar();
      const b = writeBatch(db);
      lista.forEach(x => b.delete(doc(db, 'rifas', id, 'reservas', x.id)));
      b.delete(ref); await b.commit();
      location.href = BASE;
    } catch (e) { toast('Error: ' + e.message, 4000); }
  }
}

// ---------- enrutador ----------
const rid = P.get('r'), bid = P.get('b');
if (rid && bid) vistaBoleta(rid, bid);
else if (rid && !P.has('panel')) vistaPublica(rid);
else vistaPanel();
</script>
</body>
</html>
